<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register | Health++</title>
  <link rel="icon" href="../image/logo.png">
  <link rel="stylesheet" href="registration.css?v=<?= time() ?>">
  <script defer src="registration.js"></script>
</head>
<body>
  <div class="page-wrapper">
    <div class="registration-container">
      <h2>Create Your Account</h2>

      <form id="RegistrationForm" action="registration.php" method="POST">
        <input type="text" name="FirstName" placeholder="First Name" required>
        <input type="text" name="LastName" placeholder="Last Name" required>
	<input type="text" name="username" placeholder="Username" required pattern="^[a-zA-Z0-9_]{4,20}$">
	<input type="email" name="email" placeholder="Email" required>
	<input type="tel" name="phone" placeholder="+60123456789" required>
	<input type="date" name="DoB" required>
	<input type="number" name="height" placeholder="Height (cm)" min="50" max="300" step="1" required>
	<input type="number" name="weight" placeholder="Weight (kg)" min="10" max="500" step="0.1" required>
	<input type="password" name="password" placeholder="Password (min 8 characters)" minlength="8" required>
	<input type="password" name="confirm_password" placeholder="Confirm Password" required>
        <button type="submit">Register</button>
        <div id="form-errors"></div>
      </form>

      <p>Already registered? <a href="../login/login.html">Login here</a></p>
    </div>
  </div>

</body>
</html>
