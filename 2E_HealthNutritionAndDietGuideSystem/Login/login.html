<!DOCTYPE html>
<html>
<head>
  <title>Login | Health++</title>
  <link rel="icon" href="../image/logo.png">
  <link rel="stylesheet" href="login.css?v=<?= time() ?>">
</head>
<body>
  <div class="page-wrapper">
    <div class="login-container">
      <h2>Login to Your Account</h2>
    
      <form id="loginForm" method="POST" action="login.php">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
      
        <!-- Redirect target from query string -->
        <input type="hidden" name="redirect" id="redirectField">
      
        <button type="submit">Login</button>
      </form>

      <p>Don't have an account? <a href="../registration/registration.html">Register here</a></p>
    </div>
  </div>
  
  <footer>
    <p>&copy; 2025 Health++. All rights reserved.</p>
  </footer>

  <script>
    // Preserve the ?redirect=... from URL if present
    const urlParams = new URLSearchParams(window.location.search);
    const redirectPath = urlParams.get("redirect");
    if (redirectPath) {
      document.getElementById("redirectField").value = redirectPath;
      const form = document.getElementById("loginForm");
      form.action = `login.php?redirect=${encodeURIComponent(redirectPath)}`;
    }
  </script>
</body>
</html>
